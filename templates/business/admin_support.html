{% extends 'base.html' %}{% block title %}Yordam markazi — CwHUB{% endblock %}{% block content %}<div class="page-head"><div><h1 class="page-title">Yordam markazi</h1></div></div><div class="panel" style="padding:20px">{% for t in tickets %}<div class="stat-line"><a href="{{ url_for('business.ticket_detail',id=t.id) }}">#{{ t.id }} · {{ t.subject }}</a><span>@{{ t.user.username }} · {{ t.status|uz_status }}</span><form method="post" action="{{ url_for('business.ticket_status',id=t.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select name="status"><option>OPEN</option><option>PENDING_USER</option><option>RESOLVED</option><option>CLOSED</option></select><button class="secondary-btn">Saqlash</button></form></div>{% else %}<p>Hali ticket yo‘q.</p>{% endfor %}</div>{% endblock %}
