services:
  - type: web
    name: cwhub-cs16-marketplace
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py init-db && gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: cwhub-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@cwhub.local
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_DEBUG
        value: 0
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: REMEMBER_COOKIE_SECURE
        value: true
      - key: STORAGE_BACKEND
        value: local
      - key: SUPPORT_TELEGRAM
        value: https://t.me/shokirjonshokirov
      - key: ADMIN_BOOTSTRAP
        value: true

databases:
  - name: cwhub-postgres
    databaseName: cwhub
    user: cwhub
    plan: free
